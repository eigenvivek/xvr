[project]
name = "xvr"
version = "0.0.0rc2"
description = "Differentiable 2D/3D X-ray to volume registration"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Vivek Gopalakrishnan", email = "vivekg@mit.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "attrs>=25.0.0",
    "cyclopts>=4.6.0",
    "diffdrr>=0.6.0",
    "jaxtyping>=0.3.0",
    "pydicom[pixeldata]>=3.0.0",
    "setuptools>=82.0.0",
    "wandb>=0.22.0",
]

[project.scripts]
xvr = "xvr.cli:main"

[project.urls]
Repository = "https://github.com/eigenvivek/xvr"
Issues = "https://github.com/eigenvivek/xvr/issues"

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]
lint.extend-select = ["I"]
lint.ignore = [
    "F722",  # Forward annotation false positive from jaxtyping
    "F821",  # Forward annotation false positive from jaxtyping
]
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/xvr/cli/configs/register.py" = ["E501"]
"src/xvr/cli/configs/train.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["xvr"]
known-third-party = ["wandb"]

[tool.pytest.ini_options]
filterwarnings = [
    # torchio reads NIfTI through SimpleITK, whose SWIG bindings trip this on import
    "ignore:builtin type Swig.*has no __module__:DeprecationWarning",
]

[tool.ty.src]
include = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "prek>=0.3.2",
    "pytest>=9.0.2",
    "ty>=0.0.21",
]
docs = [
    "cyclopts>=4.11.2",
    "mkdocstrings-python>=2.0.7",
    "ruff>=0.14.3",
    "zensical==0.0.57",
]
