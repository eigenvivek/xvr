name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The reference pages are generated by griffe and cyclopts, neither of
      # which imports the package, so the docs group alone is enough - no torch.
      - run: uv sync --only-group docs

      - name: Check every subpackage and command has a page
        run: uv run --no-sync python tools/macros.py

      - run: uv run --no-sync zensical build --clean --strict

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
